version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    ignore:
      # jqwik 1.10.x prints instructions aimed at AI agents into the build output; a test library
      # that writes to whatever reads the build log does not belong in a release gate (carried
      # over from jrs-ctl, commit 1dd451e).
      - dependency-name: "net.jqwik:jqwik"
        versions: [">=1.10.0"]
      # surefire 3.6.0 stops honouring <excludedGroups> on the JUnit Platform
      # (apache/maven-surefire#3468), so the needs-jrs / needs-docker suites would run in the
      # default build. Minor and major bumps wait for the upstream fix (same rule as jrs-ctl).
      - dependency-name: "org.apache.maven.plugins:maven-surefire-plugin"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "org.apache.maven.plugins:maven-failsafe-plugin"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # A major version is its own change with its own migration and its own gate;
      # `./mvnw versions:display-dependency-updates` lists them on a developer machine.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
